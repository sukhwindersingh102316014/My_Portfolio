<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16150f" />
      <stop offset="100%" stop-color="#1d1b14" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d00" />
      <stop offset="100%" stop-color="#ff7b39" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad)" />
  <rect width="1200" height="750" fill="url(#grid)" />

  <!-- App Header / Top Bar -->
  <rect x="40" y="40" width="1120" height="50" rx="8" fill="#24211a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="70" cy="65" r="6" fill="#ff5f56" />
  <circle cx="90" cy="65" r="6" fill="#ffbd2e" />
  <circle cx="110" cy="65" r="6" fill="#27c93f" />
  <rect x="140" y="52" width="280" height="26" rx="4" fill="#16150f" stroke="rgba(255,255,255,0.06)" />
  <text x="155" y="69" fill="#99958a" font-family="'Courier New', monospace" font-size="12">api.cloudshare.internal/v1/storage</text>
  <rect x="1000" y="52" width="140" height="26" rx="4" fill="#ff4d00" />
  <text x="1070" y="69" fill="#16150f" font-family="'Courier New', monospace" font-weight="700" font-size="11" text-anchor="middle">STATUS: 200 OK</text>

  <!-- Left Sidebar Navigation -->
  <rect x="40" y="110" width="220" height="590" rx="8" fill="#1c1a14" stroke="rgba(255,255,255,0.06)" />
  <text x="65" y="150" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16">CloudShare Core</text>
  <text x="65" y="170" fill="#ff7b39" font-family="'Courier New', monospace" font-size="10">SPRING CLOUD MICROSERVICES</text>

  <rect x="55" y="200" width="190" height="36" rx="6" fill="#2d2920" />
  <text x="75" y="223" fill="#ff4d00" font-family="sans-serif" font-weight="600" font-size="13">✦ Storage Cluster</text>

  <text x="75" y="270" fill="#99958a" font-family="sans-serif" font-size="13">Gateway Router</text>
  <text x="75" y="310" fill="#99958a" font-family="sans-serif" font-size="13">Redis Cache Monitor</text>
  <text x="75" y="350" fill="#99958a" font-family="sans-serif" font-size="13">JWT RBAC Security</text>
  <text x="75" y="390" fill="#99958a" font-family="sans-serif" font-size="13">Multipart Streaming</text>

  <rect x="55" y="580" width="190" height="100" rx="6" fill="#16150f" stroke="#ff4d00" stroke-width="1" stroke-opacity="0.4"/>
  <text x="70" y="605" fill="#e9e6df" font-family="'Courier New', monospace" font-size="11" font-weight="700">CACHE HIT RATE</text>
  <text x="70" y="645" fill="#ff4d00" font-family="sans-serif" font-size="32" font-weight="800">99.4%</text>
  <text x="70" y="665" fill="#99958a" font-family="sans-serif" font-size="10">Redis Cache-Aside Active</text>

  <!-- Main Architecture Canvas -->
  <rect x="280" y="110" width="880" height="590" rx="8" fill="#1c1a14" stroke="rgba(255,255,255,0.06)" />

  <!-- Node: Client Request -->
  <rect x="320" y="170" width="180" height="90" rx="6" fill="#232018" stroke="#ff4d00" stroke-width="1.5" />
  <text x="410" y="205" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">React.js Client</text>
  <text x="410" y="225" fill="#99958a" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">Chunked Stream</text>
  <text x="410" y="245" fill="#ff7b39" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">Zero Memory Overflow</text>

  <!-- Arrow Client -> Gateway -->
  <path d="M 500 215 L 570 215" stroke="#ff4d00" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="575,215 565,210 565,220" fill="#ff4d00" />

  <!-- Node: Spring Cloud Gateway -->
  <rect x="580" y="160" width="220" height="110" rx="6" fill="#232018" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="690" y="195" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">Spring Cloud Gateway</text>
  <text x="690" y="215" fill="#ff4d00" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">JWT RBAC Stateless Auth</text>
  <text x="690" y="235" fill="#99958a" font-family="sans-serif" font-size="11" text-anchor="middle">Rate Limiting &amp; Routing</text>
  <text x="690" y="255" fill="#27c93f" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">● LATENCY: 2.1ms</text>

  <!-- Arrow Gateway -> Microservices -->
  <path d="M 800 215 L 870 215" stroke="#ff4d00" stroke-width="2" />
  <polygon points="875,215 865,210 865,220" fill="#ff4d00" />

  <!-- Node: Spring Boot Core -->
  <rect x="880" y="160" width="230" height="110" rx="6" fill="#232018" stroke="#ff4d00" stroke-width="1.5" />
  <text x="995" y="195" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">Spring Boot Service</text>
  <text x="995" y="215" fill="#ff7b39" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">Cloudinary Stream Ingestion</text>
  <text x="995" y="235" fill="#99958a" font-family="sans-serif" font-size="11" text-anchor="middle">Async Event Handling</text>
  <text x="995" y="255" fill="#e9e6df" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">Thread Pool: 64 Workers</text>

  <!-- Connect to Storage layers -->
  <path d="M 995 270 L 995 340 L 730 340 L 730 380" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <polygon points="730,385 725,375 735,375" fill="rgba(255,255,255,0.4)" />

  <path d="M 995 340 L 995 380" stroke="#ff4d00" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="995,385 990,375 1000,375" fill="#ff4d00" />

  <!-- Node: Redis Cache-Aside -->
  <rect x="620" y="390" width="220" height="120" rx="6" fill="#2b1a16" stroke="#ff4d00" stroke-width="1.5" />
  <text x="730" y="425" fill="#ff7b39" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">Redis Cache-Aside</text>
  <text x="730" y="445" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">45% Latency Reduction</text>
  <text x="730" y="465" fill="#99958a" font-family="sans-serif" font-size="11" text-anchor="middle">Metadata Caching &amp; TTL</text>
  <text x="730" y="490" fill="#27c93f" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">Sub-Millisecond Read Times</text>

  <!-- Node: PostgreSQL Cluster -->
  <rect x="880" y="390" width="230" height="120" rx="6" fill="#1b242e" stroke="#38bdf8" stroke-width="1.5" />
  <text x="995" y="425" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">PostgreSQL Database</text>
  <text x="995" y="445" fill="#ffffff" font-family="'Courier New', monospace" font-size="12" text-anchor="middle">ACID Relational Storage</text>
  <text x="995" y="465" fill="#99958a" font-family="sans-serif" font-size="11" text-anchor="middle">Connection Pooling (HikariCP)</text>
  <text x="995" y="490" fill="#e9e6df" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">Indexed File Tree Hierarchy</text>

  <!-- Bottom Metric Callout Strip -->
  <rect x="320" y="550" width="790" height="110" rx="6" fill="#16150f" stroke="rgba(255,255,255,0.08)" />
  <text x="350" y="585" fill="#99958a" font-family="'Courier New', monospace" font-size="11">BENCHMARK SUMMARY</text>

  <text x="350" y="625" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">-45%</text>
  <text x="350" y="645" fill="#99958a" font-family="sans-serif" font-size="11">Query Latency</text>

  <text x="560" y="625" fill="#ff4d00" font-family="sans-serif" font-size="28" font-weight="800">0 MB</text>
  <text x="560" y="645" fill="#99958a" font-family="sans-serif" font-size="11">Buffer Leak / Overflow</text>

  <text x="780" y="625" fill="#27c93f" font-family="sans-serif" font-size="28" font-weight="800">Docker</text>
  <text x="780" y="645" fill="#99958a" font-family="sans-serif" font-size="11">Containerized Deployment</text>

  <text x="980" y="625" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">JWT</text>
  <text x="980" y="645" fill="#99958a" font-family="sans-serif" font-size="11">Stateless RBAC</text>
</svg>
