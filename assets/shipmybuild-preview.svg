<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16150f" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad4)" />

  <rect x="40" y="40" width="1120" height="50" rx="8" fill="#25201d" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="70" cy="65" r="6" fill="#ff5f56" />
  <circle cx="90" cy="65" r="6" fill="#ffbd2e" />
  <circle cx="110" cy="65" r="6" fill="#27c93f" />
  <text x="140" y="69" fill="#e9e6df" font-family="'Courier New', monospace" font-size="12">ShipMyBuild // Human-in-the-Loop Autonomous AI Agent Engine</text>
  <rect x="990" y="52" width="150" height="26" rx="4" fill="#ff4d00" />
  <text x="1065" y="69" fill="#16150f" font-family="'Courier New', monospace" font-weight="700" font-size="11" text-anchor="middle">HITL: PAUSED</text>

  <!-- State Machine Flow -->
  <rect x="40" y="110" width="1120" height="380" rx="8" fill="#1f1b18" stroke="rgba(255,255,255,0.06)" />
  <text x="70" y="150" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">3-State Atomic Agent Execution Flow</text>
  <text x="70" y="175" fill="#ff7b39" font-family="'Courier New', monospace" font-size="12">STATE 1: AUTONOMOUS REASONING → STATE 2: ATOMIC PAUSE GATE → STATE 3: TELEGRAM RESOLUTION</text>

  <!-- Step 1: AI Agent Invocation -->
  <rect x="70" y="210" width="280" height="150" rx="8" fill="#2a231e" stroke="#ff4d00" stroke-width="1.5" />
  <text x="95" y="245" fill="#ff7b39" font-family="'Courier New', monospace" font-size="11">STAGE 01</text>
  <text x="95" y="275" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16">Autonomous Agent</text>
  <text x="95" y="300" fill="#99958a" font-family="sans-serif" font-size="12">Evaluates high-impact action (production deployment, billing change).</text>
  <text x="95" y="330" fill="#22c55e" font-family="'Courier New', monospace" font-size="11">✓ Triggers HITL Intercept</text>

  <!-- Arrow -->
  <path d="M 350 285 L 440 285" stroke="#ff4d00" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="445,285 435,280 435,290" fill="#ff4d00" />

  <!-- Step 2: 3-Condition PostgreSQL Gate -->
  <rect x="450" y="210" width="310" height="150" rx="8" fill="#2a231e" stroke="#38bdf8" stroke-width="1.5" />
  <text x="475" y="245" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">STAGE 02: POSTGRESQL GATE</text>
  <text x="475" y="275" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16">Atomic Lock &amp; Idempotency</text>
  <text x="475" y="300" fill="#99958a" font-family="sans-serif" font-size="12">3-Condition Gate prevents automated reply loops and duplicate callbacks.</text>
  <text x="475" y="330" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">● Condition Check: PASSED</text>

  <!-- Arrow -->
  <path d="M 760 285 L 840 285" stroke="#22c55e" stroke-width="2" />
  <polygon points="845,285 835,280 835,290" fill="#22c55e" />

  <!-- Step 3: Telegram Webhook Callback -->
  <rect x="850" y="210" width="280" height="150" rx="8" fill="#2a231e" stroke="#22c55e" stroke-width="1.5" />
  <text x="875" y="245" fill="#22c55e" font-family="'Courier New', monospace" font-size="11">STAGE 03: INTERACTIVE HITL</text>
  <text x="875" y="275" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="16">Telegram Webhook</text>
  <text x="875" y="300" fill="#99958a" font-family="sans-serif" font-size="12">Interactive button dispatched to engineers. Atomically resumes agent upon approval.</text>
  <text x="875" y="330" fill="#22c55e" font-family="'Courier New', monospace" font-size="11">✓ 6 Interactive Callbacks</text>

  <!-- Bottom Details -->
  <rect x="40" y="510" width="1120" height="190" rx="8" fill="#1f1b18" stroke="rgba(255,255,255,0.06)" />
  <text x="70" y="550" fill="#99958a" font-family="'Courier New', monospace" font-size="11">ENGINEERING ACHIEVEMENTS AT SHIPMYBUILD</text>

  <rect x="70" y="570" width="320" height="100" rx="6" fill="#16150f" />
  <text x="90" y="605" fill="#ff4d00" font-family="sans-serif" font-size="28" font-weight="800">3-State</text>
  <text x="90" y="630" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Atomic Pause &amp; Resume</text>
  <text x="90" y="650" fill="#99958a" font-family="sans-serif" font-size="11">For mission-critical autonomous actions</text>

  <rect x="430" y="570" width="320" height="100" rx="6" fill="#16150f" />
  <text x="450" y="605" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="800">0 Loops</text>
  <text x="450" y="630" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Reply Loop Elimination</text>
  <text x="450" y="650" fill="#99958a" font-family="sans-serif" font-size="11">Strict 3-condition PostgreSQL validation</text>

  <rect x="790" y="570" width="330" height="100" rx="6" fill="#16150f" />
  <text x="810" y="605" fill="#22c55e" font-family="sans-serif" font-size="28" font-weight="800">6 Callbacks</text>
  <text x="810" y="630" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Isolated Telegram Handlers</text>
  <text x="810" y="650" fill="#99958a" font-family="sans-serif" font-size="11">With duplicate-request guards</text>
</svg>
